services:
  - type: web
    name: learning-intelligence-ai
    env: python
    plan: free
    runtime: python
    region: oregon  # Optional: Choose your preferred region
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.19
    
    # IMPORTANT: Use $PORT instead of hardcoded port
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn src.app.main:app --host 0.0.0.0 --port $PORT
    
    # Health check (optional but recommended)
    healthCheckPath: /
    
    # Auto-deploy on git push
    autoDeploy: true